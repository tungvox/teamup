<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamUp</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#0d7cf2',
              'primary-hover': '#0b69d1',
              background: '#101922',
              surface: '#1C232B',
              'surface-light': '#ffffff',
              'text-secondary': '#93a2b7',
              success: '#34C759',
              warning: '#FFD700',
              danger: '#FF3B30',
            },
            fontFamily: {
              display: ['Lexend', 'sans-serif'],
              body: ['Noto Sans', 'sans-serif'],
            },
            backgroundImage: {
              'hero-gradient': 'linear-gradient(to top, rgba(16, 25, 34, 1) 10%, rgba(16, 25, 34, 0.8) 40%, rgba(16, 25, 34, 0) 100%)',
              'gold-gradient': 'linear-gradient(135deg, #FFD700 0%, #39FF14 100%)',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d3748;
        border-radius: 3px;
      }
      /* Hide scrollbar for clean UI where needed */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Responsive base styles */
      @media (min-width: 1024px) {
        body {
          padding: 1rem;
  }
}
    </style>
</head>
  <body class="bg-background text-white font-display antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
